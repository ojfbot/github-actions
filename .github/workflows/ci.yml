name: CI — Validate Actions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-actions:
    name: Lint composite actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill-audit/action.yml exists
        run: |
          test -f skill-audit/action.yml
          test -x skill-audit/pr-skill-audit.sh

      - name: Validate workflow and action YAML
        run: bash scripts/validate-yaml.sh .github/workflows/*.yml skill-audit/action.yml

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Check the checks (bad input must go red)
        run: bash tests/run-tests.sh

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: .
